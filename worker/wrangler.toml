# Деплой через CLI (необязательно — можно вставить код в панели Cloudflare, см. README.md):
#   npx wrangler deploy
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
name = "valova-booking"
main = "booking-worker.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGIN = "https://sclod.github.io"

# не больше 3 заявок в минуту с одного IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
