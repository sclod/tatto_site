<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — VALOVA</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #eee8dc;
        --ink: #16151b;
        --soft: #6b665e;
        --flash: #d23a1e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 ui-monospace, 'JetBrains Mono', Menlo, monospace;
        text-align: center;
      }
      .num {
        font: 800 clamp(96px, 30vw, 260px) / 0.85 'Arial Black', Arial, sans-serif;
        letter-spacing: -0.06em;
        margin: 0;
      }
      .num span {
        color: var(--flash);
      }
      p {
        margin: 16px 0 0;
        color: var(--soft);
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 22px;
        border: 1px solid var(--ink);
        border-radius: 99px;
        color: var(--ink);
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: var(--ink);
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="num">4<span>0</span>4</h1>
      <p>Такої сторінки немає — схоже, цей ескіз ще не намальований.</p>
      <p lang="en">This page doesn’t exist — looks like this sketch isn’t drawn yet.</p>
      <a href="/">← на головну / home</a>
    </main>
  </body>
</html>
