name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/bold-galileo-l6xk95]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # демо-копия на GitHub Pages: своего сервера там нет — заявки уходят через Direct
          VITE_SITE_URL: https://sclod.github.io/tatto_site
          VITE_BOOKING_ENDPOINT: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
