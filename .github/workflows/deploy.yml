# Публикация сайта на Cloudflare (valova.space) при каждом пуше.
# Секреты репозитория (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — токен Cloudflare (шаблон «Edit Cloudflare Workers» + зона valova.space)
#   BOT_TOKEN, CHAT_ID   — Telegram-бот для заявок (необязательно: без них сайт работает, заявки уходят через Direct)
name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/bold-galileo-l6xk95]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          npx wrangler deploy
      - name: Telegram secrets for the booking form
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: node -e 'process.stdout.write(JSON.stringify({ BOT_TOKEN: process.env.BOT_TOKEN, CHAT_ID: process.env.CHAT_ID }))' | npx wrangler secret bulk
